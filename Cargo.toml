[package]
name = "knave"
version = "0.1.0"
edition = "2024"
description = "Naively generate IP final octets from hostnames"

[dependencies]
clap = { version = "4.6.7", features = ["cargo"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
